<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{overflow:hidden;margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif}
#root{width:100%;height:100%}
.canvas{
  position:relative;width:100%;height:100%;overflow:hidden;background:#fff;
  background-image:radial-gradient(circle,#d6e1f2 1px,transparent 1px);
  background-size:18px 18px
}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.edge{fill:none;stroke:#111827;stroke-width:2}
.edge.wired{stroke:#111827}
.edge.optical{stroke:#7c3aed;stroke-width:3}
.edge.serial{stroke:#f59e0b;stroke-width:2.5;stroke-dasharray:8 5}
.edge.wireless{stroke:#0ea5e9;stroke-width:2.5;stroke-dasharray:3 6}
.edge-dot{fill:#22c55e;stroke:white;stroke-width:1.5}
.edge.status-down{stroke:#dc2626}
.edge.status-admin-down{stroke:#f59e0b}
.edge-dot.status-down{fill:#dc2626}
.edge-dot.status-admin-down{fill:#f59e0b}
.packet-pulse{fill:#2563eb;stroke:#fff;stroke-width:2;filter:drop-shadow(0 0 4px #60a5fa)}
.edge-label{
  fill:#334155;font-size:9px;font-family:Inter,Segoe UI,Arial,sans-serif;
  paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round
}
.node{
  position:absolute;width:138px;min-height:78px;
  transform:translate(-50%,-50%);
  text-align:center;cursor:grab;user-select:none;
  padding:5px 6px;border-radius:12px
}
.node:active{cursor:grabbing}
.node:hover{background:rgba(239,246,255,.65)}
.node.selected{
  background:linear-gradient(135deg,rgba(219,234,254,.96),rgba(237,233,254,.96));
  box-shadow:0 0 0 3px #2563eb,0 8px 22px rgba(37,99,235,.28);
}
.node.selected .label{color:#1d4ed8}

.node .icon{font-size:46px;line-height:1}
.node .router-img,
.node .device-img{
  width:66px;
  height:66px;
  object-fit:contain;
  display:block;
  margin:0 auto;
}
.node .label{font-size:13px;font-weight:900;color:#111827;margin-top:3px}
.node .ip{font-size:10px;color:#334155;margin-top:2px}
.node .if-list{margin-top:4px;display:flex;flex-direction:column;gap:2px;align-items:center}
.node .if-label{
  padding:2px 5px;border-radius:5px;background:rgba(255,255,255,.94);
  border:1px solid #d8e2ef;color:#172033;font-size:9px;font-weight:700;
  white-space:nowrap;box-shadow:0 2px 5px rgba(15,23,42,.08)
}
.node .if-label.connected{border-color:#86efac;background:#f0fdf4;color:#166534}
.node .if-label.connecting{border-color:#fbbf24;background:#fffbeb;color:#b45309}
.node .if-label.down{border-color:#fecaca;background:#fef2f2;color:#b91c1c}
.node .if-label.admin-down{border-color:#fed7aa;background:#fff7ed;color:#c2410c}
.handle{
  position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
  width:12px;height:12px;border-radius:50%;
  background:#22c55e;border:2px solid white;box-shadow:0 0 0 1px #15803d;
  cursor:crosshair
}
.context{
  position:absolute;
  z-index:9999;
  width:190px;
  padding:7px;
  border:1px solid #d8e1ee;
  border-radius:10px;
  background:#ffffff;
  box-shadow:0 14px 34px rgba(15,23,42,.24)
}
.context button{
  width:100%;padding:8px 9px;border:0;border-radius:7px;background:transparent;
  text-align:left;font-size:11px;font-weight:750;cursor:pointer
}
.context button:hover{background:#eef5ff;color:#1d4ed8}
.empty{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#94a3b8;font-size:13px;pointer-events:none
}

/* Colorful PeerNet topology toolbar */
.toolbar button {
  color:#fff !important;
  border:0 !important;
  border-radius:11px !important;
  font-weight:700 !important;
  box-shadow:0 4px 10px rgba(15,23,42,.14) !important;
  transition:transform .15s ease,box-shadow .15s ease,filter .15s ease !important;
}
.toolbar button:hover {
  transform:translateY(-1px);
  box-shadow:0 7px 14px rgba(15,23,42,.20) !important;
  filter:brightness(1.05);
}
.toolbar button:nth-child(1){background:linear-gradient(135deg,#0d6efd,#3185ff) !important;}
.toolbar button:nth-child(2){background:linear-gradient(135deg,#16a34a,#22c55e) !important;}
.toolbar button:nth-child(3){background:linear-gradient(135deg,#7c3aed,#9333ea) !important;}
.toolbar button:nth-child(4){background:linear-gradient(135deg,#dc2626,#ef4444) !important;}
.toolbar button:nth-child(5){background:linear-gradient(135deg,#ea580c,#f59e0b) !important;}



</style>
</head>
<body>
<div id="root"></div>
<script>
const Streamlit={
  ready(){parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*")},
  setValue(v){parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:v},"*")},
  setHeight(h){parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height:h},"*")}
}
let args={nodes:[],edges:[],selected_device:null,
  zones:[],height:560}
let dragId=null, dragStart=null, dragMoved=false, suppressNextClick=false
let menu=null, connectSource=null
const switchConnectedAt=new Map()
const switchReadyTimers=new Map()

const icons={
"Router":"🛰️","Switch":"🔀","Multilayer Switch":"🧩","Cisco IOS Firewall":"🧱",
"Router/Switch Processor":"⚙️","Access Server":"🗄️","PIX Firewall":"🛡️",
"Laptop":"💻","Server":"🖥️","PC":"🖥","Authentication Server":"🔐",
"Camera / PC Video":"📹","Network Cloud":"☁️","IP Phone":"☎️","Analog Phone":"📞"
}

function emit(action,payload={}){
  Streamlit.setValue({id:Date.now()+"-"+Math.random(),action,...payload})
}

function render(){
  const root=document.getElementById("root")
  root.innerHTML=""
  const canvas=document.createElement("div")
  canvas.className="canvas"

  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg")
  const edgeGroups=new Map()

  ;(args.edges||[]).forEach(e=>{
    const pairKey=[e.source,e.target].sort().join("::")
    if(!edgeGroups.has(pairKey))edgeGroups.set(pairKey,[])
    edgeGroups.get(pairKey).push(e)
  })

  ;(args.edges||[]).forEach(e=>{
    const a=(args.nodes||[]).find(n=>n.id===e.source)
    const b=(args.nodes||[]).find(n=>n.id===e.target)
    if(!a||!b)return

    const pairKey=[e.source,e.target].sort().join("::")
    const parallelEdges=edgeGroups.get(pairKey)||[e]
    const edgeIndex=parallelEdges.indexOf(e)
    const centeredIndex=edgeIndex-(parallelEdges.length-1)/2
    const direction=e.source<=e.target ? 1 : -1
    const curveOffset=centeredIndex*34*direction

    const dx=b.position.x-a.position.x
    const dy=b.position.y-a.position.y
    const distance=Math.max(Math.hypot(dx,dy),1)
    const normalX=-dy/distance
    const normalY=dx/distance
    const middleX=(a.position.x+b.position.x)/2
    const middleY=(a.position.y+b.position.y)/2
    const controlX=middleX+normalX*curveOffset
    const controlY=middleY+normalY*curveOffset

    const path=document.createElementNS("http://www.w3.org/2000/svg","path")
    path.setAttribute(
      "d",
      `M ${a.position.x} ${a.position.y} Q ${controlX} ${controlY} ${b.position.x} ${b.position.y}`
    )

    const connectorClass = (
      e.connector_type==="Fiber / Optical" ? "optical" :
      e.connector_type==="Serial" ? "serial" :
      e.connector_type==="Wireless" ? "wireless" :
      "wired"
    )

    const statusClass = (
      e.status==="admin-down" ? "status-admin-down" :
      e.status==="down" ? "status-down" : "status-up"
    )
    path.setAttribute("class","edge "+connectorClass+" "+statusClass)
    path.setAttribute("data-link-id",e.id||"")
    const title=document.createElementNS("http://www.w3.org/2000/svg","title")
    const sd=e.source_details||{}
    const td=e.target_details||{}
    title.textContent=[
      "Connector: "+(e.connector_type||"Ethernet / Copper"),
      "Link status: "+(e.status||"up")+" — "+(e.status_reason||""),
      (sd.device||e.source)+":"+(sd.interface||e.source_if)+
        " | IP "+(sd.ip||"unassigned")+" | "+(sd.mode||"unknown")+
        " | "+(sd.vlan||"unassigned")+" | "+(sd.status||"unknown"),
      (td.device||e.target)+":"+(td.interface||e.target_if)+
        " | IP "+(td.ip||"unassigned")+" | "+(td.mode||"unknown")+
        " | "+(td.vlan||"unassigned")+" | "+(td.status||"unknown")
    ].join("\n")
    path.appendChild(title)
    svg.appendChild(path)

    if(e.animate){
      const packet=document.createElementNS("http://www.w3.org/2000/svg","circle")
      packet.setAttribute("r","6")
      packet.setAttribute("class","packet-pulse")
      const packetTitle=document.createElementNS("http://www.w3.org/2000/svg","title")
      packetTitle.textContent=(e.animation_protocol||"ICMP")+" packet"
      packet.appendChild(packetTitle)
      const motion=document.createElementNS("http://www.w3.org/2000/svg","animateMotion")
      const motionPath=e.animation_reverse
        ? `M ${b.position.x} ${b.position.y} Q ${controlX} ${controlY} ${a.position.x} ${a.position.y}`
        : `M ${a.position.x} ${a.position.y} Q ${controlX} ${controlY} ${b.position.x} ${b.position.y}`
      motion.setAttribute("path",motionPath)
      motion.setAttribute("dur","0.9s")
      motion.setAttribute("begin",(Number(e.animation_order||0)*0.55)+"s")
      motion.setAttribute("repeatCount","3")
      motion.setAttribute("fill","freeze")
      packet.appendChild(motion)
      svg.appendChild(packet)
    }

    if(e.source_if || e.target_if){
      const label=document.createElementNS(
        "http://www.w3.org/2000/svg",
        "text"
      )
      label.setAttribute(
        "x",
        (a.position.x+2*controlX+b.position.x)/4
      )
      label.setAttribute(
        "y",
        (a.position.y+2*controlY+b.position.y)/4 - 7
      )
      label.setAttribute("text-anchor","middle")
      label.setAttribute("class","edge-label")
      label.textContent=(
        e.source + ":" + (e.source_if||"unassigned") +
        " ↔ " +
        e.target + ":" + (e.target_if||"unassigned")
      )
      svg.appendChild(label)
    }

    if(edgeIndex===0){
      ;[a,b].forEach(n=>{
        const c=document.createElementNS("http://www.w3.org/2000/svg","circle")
        c.setAttribute("cx",n.position.x)
        c.setAttribute("cy",n.position.y)
        c.setAttribute("r",5)
        c.setAttribute("class","edge-dot "+statusClass)
        svg.appendChild(c)
      })
    }
  })
  canvas.appendChild(svg)

  ;(args.nodes||[]).forEach(n=>{
    const d=document.createElement("div")
    d.className="node"+(args.selected_device===n.id ? " selected" : "")
    d.dataset.nodeId=n.id
    d.style.left=n.position.x+"px"
    d.style.top=n.position.y+"px"
    d.innerHTML=`
      ${n.device_type==="Router"

      }
      <div class="label">${n.label}</div>
      <div class="if-list">
        ${(n.interfaces||[]).map(i => {
          const status=String(i.status||"up").toLowerCase()
          const isLayer2Switch=n.device_type==="Switch"
          const connectionKey=`${n.id}:${i.name}:${i.peer||""}`
          let connectionClass=i.connected
            ? (isLayer2Switch || (i.ip && i.ip!=="unassigned")
                ? "connected"
                : "connecting")
            : ""

          if(isLayer2Switch && i.connected && status==="up"){
            if(!switchConnectedAt.has(connectionKey)){
              switchConnectedAt.set(connectionKey,Date.now())
            }
            const remaining=2000-(Date.now()-switchConnectedAt.get(connectionKey))
            if(remaining>0){
              connectionClass="connecting"
              if(!switchReadyTimers.has(connectionKey)){
                switchReadyTimers.set(connectionKey,setTimeout(()=>{
                  switchReadyTimers.delete(connectionKey)
                  render()
                },remaining+10))
              }
            }
          }

          const statusClass=status==="administratively down"
            ? "admin-down"
            : status==="down" ? "down" : connectionClass
          const ipDetail=isLayer2Switch ? "IP not required (Layer 2)" : `IP ${i.ip}`
          const label=isLayer2Switch
            ? `${i.name}${i.connected && i.peer ? ` · ${i.peer}` : ""}`
            : `${i.name}: ${i.ip} · ${i.peer||"unassigned"}`
          return `<div class="if-label ${statusClass}" title="${i.name} | ${ipDetail} | ${i.mode||"unknown"} | ${i.vlan||"unassigned"} | ${i.status||"up"} | peer ${i.peer||"unassigned"}">${label}</div>`
        }).join("")}
      </div>
      <div class="handle" title="Select this device for connection"></div>
    `

    d.onmousedown=e=>{
      if(e.button!==0 || e.target.classList.contains("handle"))return
      dragId=n.id
      dragStart={x:e.clientX,y:e.clientY}
      dragMoved=false
      e.preventDefault()
    }

    d.addEventListener("click",e=>{
      if(e.target.classList.contains("handle"))return
      e.stopPropagation()
      if(suppressNextClick){
        suppressNextClick=false
        return
      }
      emit("select_device",{node_id:n.id})
    })

    d.addEventListener("contextmenu",e=>{
      e.preventDefault()
      e.stopPropagation()

      const r=canvas.getBoundingClientRect()

      menu={
        id:n.id,
        x:e.clientX-r.left,
        y:e.clientY-r.top
      }

      render()
    })

    d.querySelector(".handle").onclick=e=>{
      e.stopPropagation()
      emit("select_for_connect",{node_id:n.id})
    }

    canvas.appendChild(d)
  })

  if((args.nodes||[]).length===0){
    const empty=document.createElement("div")
    empty.className="empty"
    empty.textContent="Add devices from the controls to begin building your topology."
    canvas.appendChild(empty)
  }

  if(menu){
    const m=document.createElement("div")
    m.className="context"

    m.style.left=Math.min(
      menu.x,
      canvas.clientWidth-200
    )+"px"

    m.style.top=Math.min(
      menu.y,
      canvas.clientHeight-250
    )+"px"

    m.onclick=e=>e.stopPropagation()
    m.oncontextmenu=e=>{
      e.preventDefault()
      e.stopPropagation()
    }

    const actions=[
      ["⚙ Configure","configure"],
      ["⌨ Open Console","open_console"],
      ["🔌 Interfaces","interfaces"],
      ["⛓ Disconnect Link","disconnect_link"],
      ["＋ Add Interface","add_interface"],
      ["🗑 Delete Device","delete_device"]
    ]

    actions.forEach(([label,action])=>{
      const button=document.createElement("button")
      button.textContent=label
      button.onclick=()=>{
        emit(action,{node_id:menu.id})
        menu=null
      }
      m.appendChild(button)
    })

    canvas.appendChild(m)
  }
  canvas.onclick=()=>{
    menu=null
    if(args.selected_device)emit("clear_selection")
    else render()
  }
  root.appendChild(canvas)
  Streamlit.setHeight(args.height||560)
}

document.addEventListener("mousemove",e=>{
  if(!dragId)return

  if(dragStart && Math.hypot(
    e.clientX-dragStart.x,
    e.clientY-dragStart.y
  )>3){
    dragMoved=true
  }
  if(!dragMoved)return

  const canvas=document.querySelector(".canvas")
  const n=(args.nodes||[]).find(x=>x.id===dragId)
  const nodeEl=[...document.querySelectorAll(".node")]
    .find(el=>el.dataset.nodeId===dragId)

  if(!canvas||!n||!nodeEl)return

  const r=canvas.getBoundingClientRect()

  const x=Math.max(
    70,
    Math.min(e.clientX-r.left,canvas.clientWidth-70)
  )
  const y=Math.max(
    55,
    Math.min(e.clientY-r.top,canvas.clientHeight-55)
  )

  n.position.x=x
  n.position.y=y

  // Performance: move only this DOM node during drag.
  // The complete topology/links redraw once the mouse is released.
  nodeEl.style.left=x+"px"
  nodeEl.style.top=y+"px"
})

document.addEventListener("mouseup",()=>{
  if(!dragId)return

  const n=(args.nodes||[]).find(x=>x.id===dragId)

  if(n && dragMoved){
    emit("move",{
      node_id:dragId,
      position:{x:n.position.x,y:n.position.y}
    })
  }

  suppressNextClick=dragMoved
  dragId=null
  dragStart=null
  dragMoved=false
})

document.addEventListener("keydown",event=>{
  const tag=String(event.target?.tagName||"").toLowerCase()
  if(event.key==="Escape"){
    menu=null
    if(args.selected_device)emit("clear_selection")
    else render()
    return
  }
  if((event.ctrlKey||event.metaKey) && event.key.toLowerCase()==="z" &&
     !["input","textarea","select"].includes(tag)){
    event.preventDefault()
    emit("undo_delete")
  }
})

window.addEventListener("message",e=>{
  if(e.data?.type!=="streamlit:render")return
  args=e.data.args||args
  render()
})

Streamlit.ready()
</script>
</body>
</html>
